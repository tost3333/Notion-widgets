<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#191919; --fg:#ffffff; --muted:#d4d4d4; --dim:#9b9b9b; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:var(--bg); }
  body {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', ui-monospace, Consolas, monospace;
    color:var(--fg); text-align:center; padding:8px; overflow:hidden;
  }
  #time { font-weight:700; font-size:clamp(48px, 17vw, 96px); line-height:1.05; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
  #date { font-size:clamp(15px, 4.6vw, 26px); color:var(--muted); margin-top:10px; }
</style>
</head>
<body>
  <div id="time">--:--</div>
  <div id="date"></div>
<script>
  // ---- settings ----
  const HOUR12 = false;         // true for 12-hour clock
  const TIMEZONE = "Europe/Zurich";
  // ------------------
  const tf = new Intl.DateTimeFormat("en-GB", { hour:"2-digit", minute:"2-digit", hour12:HOUR12, timeZone:TIMEZONE });
  const df = new Intl.DateTimeFormat("en-GB", { weekday:"short", day:"numeric", month:"short", year:"numeric", timeZone:TIMEZONE });

  function tick() {
    const now = new Date();
    document.getElementById("time").textContent = tf.format(now);
    document.getElementById("date").textContent = df.format(now).replace(/,/g, ",");
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
