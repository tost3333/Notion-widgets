<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Tinos:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#191919; --fg:#ffffff; --muted:#d4d4d4; --dim:#9b9b9b; --line:#2f2f2f; --cloud:#8c8c8c; }
  * { box-sizing:border-box; margin:0; }
  html, body { background:var(--bg); }
  body { font-family:'IBM Plex Mono', ui-monospace, Consolas, monospace; color:var(--fg); padding:16px; }
  .wrap { max-width:620px; margin:0 auto; }

  svg { display:block; fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
  svg .c { stroke:var(--cloud); }
  svg .w { stroke:var(--fg); }
  svg .bg { fill:var(--bg); }

  .today { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; column-gap:clamp(20px, 6vw, 44px); margin:6px 0 6px; }
  .city { font-size:clamp(11px, 2.6vw, 14px); letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  .today .icon svg { width:clamp(52px, 13vw, 76px); height:clamp(52px, 13vw, 76px); }
  .today .temp { font-family:'Tinos', 'Times New Roman', Georgia, serif; font-weight:400; font-size:clamp(44px, 11.5vw, 62px); line-height:1; justify-self:start; }
  .place { text-align:left; justify-self:end; }
  .cond { color:var(--muted); font-size:clamp(14px, 3.6vw, 18px); margin-top:14px; }

  .week { display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; margin-top:20px; padding-top:16px; border-top:1px solid var(--line); }
  .day { display:flex; flex-direction:column; align-items:center; font-size:12px; }
  .day .n { color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  .pair { display:flex; align-items:center; justify-content:center; gap:5px; margin-top:8px; }
  .pair svg { width:24px; height:24px; flex:none; }
  .nums { line-height:1.25; text-align:left; }
  .nums .hi { font-weight:700; }
  .nums .lo { color:var(--dim); }
  .err { text-align:center; color:var(--dim); padding:24px 0; }
  @media (max-width:440px) { .day { font-size:10px; } .pair { gap:3px; } .pair svg { width:18px; height:18px; } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="err">Loading weather…</div></div>
<script>
  // ---- settings ----
  const CITY = "Lausanne";
  const LAT = 46.5197, LON = 6.6323;
  const TZ = "Europe/Zurich";
  // ------------------

  // Minimal line icons: clouds grey (.c), everything else white (.w)
  const CLOUD = '<path class="c" d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>';
  const CLOUD_HIGH = '<path class="c" stroke-width="1.9" transform="translate(2.4 -1) scale(.8)" d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>';
  const SUN_RAYS = '<path class="w" d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>';
  const ICONS = {
    clear:   '<circle class="w" cx="12" cy="12" r="4.5"/>' + SUN_RAYS,
    mostly:  '<circle class="w" cx="12" cy="12" r="4.5"/>' + SUN_RAYS,
    partly:  '<circle class="w" cx="8" cy="8" r="3.2"/><path class="w" d="M8 1.5v1.3M2.2 3.2l.9.9M1.5 8h1.3M13.8 3.2l-.9.9"/>' +
             '<path class="c bg" d="M9 21h9a4.5 4.5 0 0 0 .6-8.96A6 6 0 0 0 7.2 14.3 3.4 3.4 0 0 0 9 21z"/>',
    cloud:   CLOUD,
    fog:     CLOUD_HIGH + '<path class="w" d="M5 18.5h14M8 22h11"/>',
    drizzle: CLOUD_HIGH + '<path class="w" d="M8 18.5v1M12 19.5v1M16 18.5v1M8 22v.5M12 23v.5M16 22v.5"/>',
    rain:    CLOUD_HIGH + '<path class="w" d="M8 18v3M12 19v3M16 18v3"/>',
    snow:    CLOUD_HIGH + '<path class="w" d="M8 18.5h.01M8 22h.01M12 20h.01M12 23h.01M16 18.5h.01M16 22h.01"/>',
    thunder: CLOUD_HIGH + '<path class="w" d="M12.5 15.5l-3 4h5l-3 4"/>'
  };
  const icon = (k) => '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[k] + '</svg>';

  const WMO = (c) => {
    if (c === 0) return ["clear", "Clear sky"];
    if (c === 1) return ["mostly", "Mainly clear"];
    if (c === 2) return ["partly", "Partly cloudy"];
    if (c === 3) return ["cloud", "Overcast"];
    if (c === 45 || c === 48) return ["fog", "Fog"];
    if (c >= 51 && c <= 57) return ["drizzle", "Drizzle"];
    if (c >= 61 && c <= 67) return ["rain", "Rain"];
    if (c >= 71 && c <= 77) return ["snow", "Snow"];
    if (c >= 80 && c <= 82) return ["rain", "Rain showers"];
    if (c === 85 || c === 86) return ["snow", "Snow showers"];
    if (c >= 95) return ["thunder", "Thunderstorm"];
    return ["cloud", "—"];
  };

  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
    "&current=temperature_2m,weather_code" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min" +
    "&timezone=" + encodeURIComponent(TZ) + "&forecast_days=8";

  async function load() {
    const app = document.getElementById("app");
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      const [ik, label] = WMO(d.current.weather_code);
      // skip index 0 (today): show the next 7 days
      const days = d.daily.time.slice(1).map((t, j) => {
        const i = j + 1;
        const [k] = WMO(d.daily.weather_code[i]);
        const name = new Date(t + "T12:00:00").toLocaleDateString("en-GB", { weekday:"short" });
        return '<div class="day"><div class="n">' + name + '</div><div class="pair">' + icon(k) +
          '<div class="nums"><div class="hi">' + Math.round(d.daily.temperature_2m_max[i]) + '°</div><div class="lo">' +
          Math.round(d.daily.temperature_2m_min[i]) + '°</div></div></div></div>';
      }).join("");
      app.innerHTML =
        '<div class="today"><div class="place"><div class="city">' + CITY + '</div><div class="cond">' + label + '</div></div><div class="icon">' + icon(ik) + '</div>' +
        '<div class="temp">' + Math.round(d.current.temperature_2m) + '°</div></div>' +
        '<div class="week">' + days + '</div>';
    } catch (e) {
      app.innerHTML = '<div class="err">Weather unavailable. Retrying…</div>';
    }
  }
  load();
  setInterval(load, 30 * 60 * 1000);
</script>
</body>
</html>
