<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Tinos:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#191919; --fg:#ffffff; --muted:#d4d4d4; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; color:var(--fg); text-align:center; }
  /* Everything inside is sized in em, so scaling #box's font-size scales the whole clock. */
  #box { font-size:100px; white-space:nowrap; visibility:hidden; }
  #time { font-family:'Tinos', 'Times New Roman', Georgia, serif; font-weight:400; font-size:1em; line-height:1; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
  #date { font-family:'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size:.23em; line-height:1.2; color:var(--muted); margin-top:.35em; }
</style>
</head>
<body>
  <div id="box">
    <div id="time">--:--</div>
    <div id="date"></div>
  </div>
<script>
  // ---- settings ----
  const HOUR12 = false;         // true for 12-hour clock
  const TIMEZONE = "Europe/Zurich";
  const FILL = 0.92;            // how much of the embed area the clock may use (0-1)
  // ------------------
  const tf = new Intl.DateTimeFormat("en-GB", { hour:"2-digit", minute:"2-digit", hour12:HOUR12, timeZone:TIMEZONE });
  const df = new Intl.DateTimeFormat("en-GB", { weekday:"short", day:"numeric", month:"short", year:"numeric", timeZone:TIMEZONE });
  const box = document.getElementById("box");

  // Scale the clock so it fills the embed area (whichever of width/height runs out first).
  function fit() {
    box.style.fontSize = "100px";
    const w = box.offsetWidth, h = box.offsetHeight;
    if (!w || !h) return;
    const s = Math.min(window.innerWidth * FILL / w, window.innerHeight * FILL / h);
    box.style.fontSize = (100 * s) + "px";
    box.style.visibility = "visible";
  }

  function tick() {
    const now = new Date();
    document.getElementById("time").textContent = tf.format(now);
    document.getElementById("date").textContent = df.format(now);
  }
  tick();
  fit();
  window.addEventListener("resize", fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit); // re-fit once Tinos/Plex have loaded
  setInterval(tick, 1000);
</script>
</body>
</html>
